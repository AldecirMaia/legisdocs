version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: legisdocs_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: legisdocs
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: legisdocs_redis
    ports:
      - "6380:6379"

volumes:
  pgdata: